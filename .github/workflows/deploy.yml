name: Deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"  # cek perubahan spreadsheet setiap 10 menit
  workflow_dispatch:         # tombol "Run workflow" untuk update manual

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Siapkan file website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          touch _site/.nojekyll
          # penanda versi: browser selalu memuat CSS/JS/ikon terbaru setelah ada perubahan
          V="${GITHUB_SHA::7}"
          sed -i "s#assets/css/style.css#assets/css/style.css?v=$V#; s#assets/js/bar-chart.js#assets/js/bar-chart.js?v=$V#; s#assets/js/app.js#assets/js/app.js?v=$V#" _site/index.html
          sed -i "s#assets/img/icon-\${name}.png#assets/img/icon-\${name}.png?v=$V#" _site/assets/js/app.js
          grep -o 'v=[0-9a-f]*' _site/index.html | sort -u

      - name: Ambil data dari Google Sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/fetch_data.py _site/data.json

      - name: Bandingkan dengan data yang sedang tayang
        id: compare
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
          FORCE: ${{ github.event_name != 'schedule' }}
        run: python scripts/compare_data.py _site/data.json "$SITE_URL"

      - name: Pasang LibreOffice dan font (untuk PDF)
        if: steps.compare.outputs.changed == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress fonts-dejavu-core > /dev/null
          mkdir -p ~/.local/share/fonts && cp scripts/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f > /dev/null
          pip install -q python-pptx==1.0.2

      - name: Buat file PPT dan PDF
        if: steps.compare.outputs.changed == 'true'
        continue-on-error: true   # jika gagal, website tetap di-deploy (tombol unduh disembunyikan)
        run: |
          mkdir -p _site/unduh
          python scripts/build_pptx.py _site/data.json _site/unduh/weekly-boa.pptx
          soffice --headless --convert-to pdf --outdir _site/unduh _site/unduh/weekly-boa.pptx
          ls -la _site/unduh

      - uses: actions/configure-pages@v5
        if: steps.compare.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.compare.outputs.changed == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
