name: Deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"  # cek perubahan spreadsheet setiap 10 menit
  workflow_dispatch:         # tombol "Run workflow" untuk update manual

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Siapkan file website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - name: Ambil data dari Google Sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/fetch_data.py _site/data.json

      - name: Bandingkan dengan data yang sedang tayang
        id: compare
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
          FORCE: ${{ github.event_name != 'schedule' }}
        run: python scripts/compare_data.py _site/data.json "$SITE_URL"

      - uses: actions/configure-pages@v5
        if: steps.compare.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.compare.outputs.changed == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
