  <script>
    /* HP & tablet: tampilkan layout laptop (lebar 1280px) yang diperkecil otomatis
       agar sama persis dengan versi laptop dan terlihat penuh di layar. */
    (function () {
      var LAYOUT = 1280;
      if (Math.min(screen.width, screen.height) < 820 || screen.width < LAYOUT) {
        document.getElementById("viewport").setAttribute("content", "width=" + LAYOUT);
        document.documentElement.classList.add("scaled");
      }
    })();
  </script>
